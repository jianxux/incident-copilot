{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh] px-4">
  <div class="w-full max-w-xl text-center">
    <div class="mx-auto inline-flex items-center justify-center w-24 h-24 bg-brand/15 rounded-full mb-6">
      <i class="fas fa-exclamation-triangle text-brand text-4xl"></i>
    </div>

    <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 mb-3">Something went wrong</h1>
    <p class="text-muted text-base sm:text-lg mb-8">{{ error }}</p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/dashboard"
         class="bg-brand hover:bg-brand-dark text-white px-6 py-3 rounded-lg font-semibold transition inline-flex items-center justify-center">
        <i class="fas fa-arrow-left mr-2"></i>
        Back to Dashboard
      </a>
      <a href="/dashboard/demo"
         class="px-6 py-3 rounded-lg border border-stone-200 bg-white/70 hover:bg-white transition font-semibold text-slate-900 inline-flex items-center justify-center">
        View Demo
      </a>
    </div>

    <p class="mt-6 text-xs text-slate-500">If this keeps happening, copy the URL and tell your on-call teammate.</p>
  </div>
</div>
{% endblock %}
