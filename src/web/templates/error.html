{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[50vh]">
    <div class="text-center">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-red-500/20 rounded-full mb-6">
            <i class="fas fa-exclamation-triangle text-red-400 text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-slate-900 mb-2">Oops!</h1>
        <p class="text-muted text-lg mb-8">{{ error }}</p>
        <a href="/dashboard" 
           class="bg-slate-900 text-white hover:bg-slate-800 px-6 py-3 rounded-lg font-medium transition inline-flex items-center">
            <i class="fas fa-arrow-left mr-2"></i>
            Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
