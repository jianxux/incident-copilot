{% extends "base.html" %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
    <div>
        <a href="/dashboard/incident/{{ incident_id }}" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-900 transition">
            <i class="fas fa-arrow-left mr-2"></i>
            Back to Incident
        </a>
        <h1 class="mt-2 text-2xl font-semibold text-slate-900">Copilot Chat</h1>
        <p class="text-sm text-slate-500">Incident {{ incident_id }} · {{ incident.service_name }}</p>
    </div>
</div>

<div class="rounded-xl border border-slate-200 bg-white card-shadow overflow-hidden h-[72vh] flex flex-col">
    <div class="border-b border-slate-200 p-4 flex flex-wrap gap-2">
        <button type="button" data-action="summary" class="quick-action rounded-lg bg-slate-100 px-3 py-2 text-sm text-slate-700 hover:bg-slate-200 transition">
            Summarize
        </button>
        <button type="button" data-action="suggest" class="quick-action rounded-lg bg-slate-100 px-3 py-2 text-sm text-slate-700 hover:bg-slate-200 transition">
            Suggest Next Steps
        </button>
        <button type="button" data-action="chat" data-message="What changed recently that could have triggered this incident?" class="quick-action rounded-lg bg-slate-100 px-3 py-2 text-sm text-slate-700 hover:bg-slate-200 transition">
            What Changed?
        </button>
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto bg-slate-50 p-4 space-y-3">
        <div class="text-xs text-slate-500 text-center">Connected to incident copilot</div>
    </div>

    <div id="generating" class="hidden px-4 py-2 text-sm text-slate-500 border-t border-slate-200 bg-white">
        Generating...
    </div>

    <form id="chat-form" class="border-t border-slate-200 p-4 bg-white flex items-center gap-3">
        <input
            id="chat-input"
            type="text"
            placeholder="Ask a question about this incident..."
            class="flex-1 rounded-lg border border-slate-300 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
        />
        <button type="submit" class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm hover:bg-slate-800 transition">
            Send
        </button>
    </form>
</div>

<script>
(() => {
    const incidentId = "{{ incident_id }}";
    const proto = window.location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${window.location.host}/ws/copilot/${incidentId}`);

    const messagesEl = document.getElementById("chat-messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("chat-input");
    const generatingEl = document.getElementById("generating");

    function renderMessage(roleLabel, text, timestamp, isUser = false) {
        const wrapper = document.createElement("div");
        wrapper.className = `flex ${isUser ? "justify-end" : "justify-start"}`;

        const bubble = document.createElement("div");
        bubble.className = `${isUser ? "bg-slate-900 text-white" : "bg-white text-slate-800 border border-slate-200"} max-w-3xl rounded-xl px-4 py-3`;

        const meta = document.createElement("div");
        meta.className = `text-xs ${isUser ? "text-slate-300" : "text-slate-500"} mb-1`;
        const date = timestamp ? new Date(timestamp) : new Date();
        meta.textContent = `${roleLabel} · ${date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;

        const body = document.createElement("div");
        body.className = "whitespace-pre-wrap text-sm leading-6";
        body.textContent = text;

        bubble.appendChild(meta);
        bubble.appendChild(body);
        wrapper.appendChild(bubble);
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showGenerating(show) {
        generatingEl.classList.toggle("hidden", !show);
        if (show) {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    }

    ws.addEventListener("message", (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "assistant_typing") {
            showGenerating(true);
            return;
        }

        if (data.type === "assistant") {
            showGenerating(false);
            renderMessage("Copilot", data.message, data.timestamp, false);
            return;
        }

        if (data.type === "error") {
            showGenerating(false);
            renderMessage("System", data.message, data.timestamp, false);
            return;
        }
    });

    ws.addEventListener("close", () => {
        renderMessage("System", "Connection closed", new Date().toISOString(), false);
    });

    formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = inputEl.value.trim();
        if (!message) {
            return;
        }

        renderMessage("You", message, new Date().toISOString(), true);
        ws.send(JSON.stringify({ action: "chat", message }));
        inputEl.value = "";
        inputEl.focus();
    });

    document.querySelectorAll(".quick-action").forEach((button) => {
        button.addEventListener("click", () => {
            const action = button.dataset.action;
            const message = button.dataset.message || "";

            if (action === "chat" && message) {
                renderMessage("You", message, new Date().toISOString(), true);
                ws.send(JSON.stringify({ action: "chat", message }));
                return;
            }

            ws.send(JSON.stringify({ action, message }));
            showGenerating(true);
        });
    });
})();
</script>
{% endblock %}
