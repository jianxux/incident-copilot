{% extends "base.html" %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
    <div>
        <a href="/dashboard/incident/{{ incident_id }}" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-900 transition">
            <i class="fas fa-arrow-left mr-2"></i>
            Back to Incident
        </a>
        <h1 class="mt-2 text-2xl font-semibold text-slate-900">Copilot Chat</h1>
        <p class="text-sm text-slate-500">Incident {{ incident_id }} · {{ incident.service_name }}</p>
    </div>
</div>

<div class="rounded-xl border border-slate-200 bg-white card-shadow overflow-hidden h-[72vh] flex flex-col">
    <div class="border-b border-slate-200 p-4 flex flex-wrap gap-2">
        <button type="button" data-action="summary" class="quick-action rounded-lg bg-slate-100 px-3 py-2 text-sm text-slate-700 hover:bg-slate-200 transition">
            Summarize
        </button>
        <button type="button" data-action="suggest" class="quick-action rounded-lg bg-slate-100 px-3 py-2 text-sm text-slate-700 hover:bg-slate-200 transition">
            Suggest Next Steps
        </button>
        <button type="button" data-action="chat" data-message="What changed recently that could have triggered this incident?" class="quick-action rounded-lg bg-slate-100 px-3 py-2 text-sm text-slate-700 hover:bg-slate-200 transition">
            What Changed?
        </button>
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto bg-slate-50 p-4 space-y-3">
        <div class="text-xs text-slate-500 text-center flex items-center justify-center gap-2">
            <span id="connection-status-dot" class="inline-block h-2 w-2 rounded-full bg-green-500"></span>
            <span>Connected to incident copilot</span>
            <span id="connection-status-text">connected</span>
        </div>
    </div>

    <div id="generating" class="hidden px-4 py-2 text-sm text-slate-500 border-t border-slate-200 bg-white">
        Generating...
    </div>

    <form id="chat-form" class="border-t border-slate-200 p-4 bg-white flex items-center gap-3">
        <input
            id="chat-input"
            type="text"
            placeholder="Ask a question about this incident..."
            class="flex-1 rounded-lg border border-slate-300 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
        />
        <button type="submit" class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm hover:bg-slate-800 transition">
            Send
        </button>
    </form>
</div>

<script>
(() => {
    const incidentId = "{{ incident_id }}";
    const proto = window.location.protocol === "https:" ? "wss" : "ws";
    const wsUrl = `${proto}://${window.location.host}/ws/copilot/${incidentId}`;
    const MAX_RECONNECT_ATTEMPTS = 10;
    const MAX_RECONNECT_DELAY_MS = 10000;
    const BASE_RECONNECT_DELAY_MS = 1000;

    const messagesEl = document.getElementById("chat-messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("chat-input");
    const generatingEl = document.getElementById("generating");
    const connectionStatusDotEl = document.getElementById("connection-status-dot");
    const connectionStatusTextEl = document.getElementById("connection-status-text");

    let ws = null;
    let reconnectAttempts = 0;
    let reconnectTimer = null;
    let hasConnectedOnce = false;
    let manualClose = false;
    const pendingMessages = [];

    function renderMessage(roleLabel, text, timestamp, isUser = false) {
        const wrapper = document.createElement("div");
        wrapper.className = `flex ${isUser ? "justify-end" : "justify-start"}`;

        const bubble = document.createElement("div");
        bubble.className = `${isUser ? "bg-slate-900 text-white" : "bg-white text-slate-800 border border-slate-200"} max-w-3xl rounded-xl px-4 py-3`;

        const meta = document.createElement("div");
        meta.className = `text-xs ${isUser ? "text-slate-300" : "text-slate-500"} mb-1`;
        const date = timestamp ? new Date(timestamp) : new Date();
        meta.textContent = `${roleLabel} · ${date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;

        const body = document.createElement("div");
        body.className = "whitespace-pre-wrap text-sm leading-6";
        body.textContent = text;

        bubble.appendChild(meta);
        bubble.appendChild(body);
        wrapper.appendChild(bubble);
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showGenerating(show) {
        generatingEl.classList.toggle("hidden", !show);
        if (show) {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    }

    function updateConnectionStatus(status) {
        const statusConfig = {
            connected: { text: "connected", dotClass: "bg-green-500" },
            reconnecting: { text: "reconnecting", dotClass: "bg-amber-400" },
            disconnected: { text: "disconnected", dotClass: "bg-red-500" }
        };
        const config = statusConfig[status] || statusConfig.disconnected;
        connectionStatusTextEl.textContent = config.text;
        connectionStatusDotEl.classList.remove("bg-green-500", "bg-amber-400", "bg-red-500");
        connectionStatusDotEl.classList.add(config.dotClass);
    }

    function flushPendingMessages() {
        while (pendingMessages.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(pendingMessages.shift());
        }
    }

    function scheduleReconnect() {
        if (manualClose || reconnectTimer || reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
            if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                updateConnectionStatus("disconnected");
                renderMessage(
                    "System",
                    "Connection lost. Refresh to retry.",
                    new Date().toISOString(),
                    false
                );
            }
            return;
        }

        const delay = Math.min(
            BASE_RECONNECT_DELAY_MS * (2 ** reconnectAttempts),
            MAX_RECONNECT_DELAY_MS
        );
        reconnectAttempts += 1;
        updateConnectionStatus("reconnecting");

        reconnectTimer = window.setTimeout(() => {
            reconnectTimer = null;
            connect();
        }, delay);
    }

    function connect() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
            return;
        }

        ws = new WebSocket(wsUrl);
        if (hasConnectedOnce) {
            updateConnectionStatus("reconnecting");
        }

        ws.addEventListener("open", () => {
            const reconnected = hasConnectedOnce;
            hasConnectedOnce = true;
            reconnectAttempts = 0;
            if (reconnectTimer) {
                window.clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            updateConnectionStatus("connected");
            flushPendingMessages();
            if (reconnected) {
                renderMessage("System", "Reconnected to copilot", new Date().toISOString(), false);
            }
        });

        ws.addEventListener("message", (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "assistant_typing") {
                showGenerating(true);
                return;
            }

            if (data.type === "assistant") {
                showGenerating(false);
                renderMessage("Copilot", data.message, data.timestamp, false);
                return;
            }

            if (data.type === "error") {
                showGenerating(false);
                renderMessage("System", data.message, data.timestamp, false);
                return;
            }
        });

        ws.addEventListener("close", (event) => {
            if (manualClose) {
                updateConnectionStatus("disconnected");
                return;
            }
            // Don't reconnect on server-initiated error close (1011) or normal close (1000)
            if (event.code === 1011 || event.code === 1000) {
                updateConnectionStatus("disconnected");
                renderMessage("System", "Connection closed by server", new Date().toISOString(), false);
                return;
            }
            updateConnectionStatus("reconnecting");
            scheduleReconnect();
        });

        ws.addEventListener("error", () => {
            updateConnectionStatus("reconnecting");
        });
    }

    function sendPayload(payload) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(payload);
            return true;
        }
        pendingMessages.push(payload);
        updateConnectionStatus("reconnecting");
        if (!ws || ws.readyState === WebSocket.CLOSING || ws.readyState === WebSocket.CLOSED) {
            scheduleReconnect();
        }
        return false;
    }

    connect();

    formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = inputEl.value.trim();
        if (!message) {
            return;
        }

        renderMessage("You", message, new Date().toISOString(), true);
        sendPayload(JSON.stringify({ action: "chat", message }));
        inputEl.value = "";
        inputEl.focus();
    });

    document.querySelectorAll(".quick-action").forEach((button) => {
        button.addEventListener("click", () => {
            const action = button.dataset.action;
            const message = button.dataset.message || "";

            if (action === "chat" && message) {
                renderMessage("You", message, new Date().toISOString(), true);
                sendPayload(JSON.stringify({ action: "chat", message }));
                return;
            }

            sendPayload(JSON.stringify({ action, message }));
            showGenerating(true);
        });
    });

    window.addEventListener("beforeunload", () => {
        manualClose = true;
        if (reconnectTimer) {
            window.clearTimeout(reconnectTimer);
        }
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
            ws.close();
        }
    });
})();
</script>
{% endblock %}
