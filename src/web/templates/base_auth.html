<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Incident Copilot</title>
    <link rel="icon" type="image/svg+xml" href="/dashboard/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand': '#4f46e5',
                        'brand-dark': '#4338ca',
                        'muted': '#64748b',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-50 text-slate-900">
    <div class="min-h-full flex flex-col items-center justify-center py-12 px-4">
        <!-- Logo -->
        <a href="/" class="flex items-center space-x-3 mb-8">
            <svg class="w-10 h-10 text-brand" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="currentColor"/>
                <path d="M16 8v8l6 3" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="16" cy="16" r="6" stroke="white" stroke-width="2" fill="none"/>
            </svg>
            <span class="text-xl font-semibold text-slate-900">Incident Copilot</span>
        </a>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
