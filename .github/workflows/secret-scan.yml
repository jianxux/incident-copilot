name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanner
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets==1.5.0

      - name: Run detect-secrets against baseline
        run: |
          detect-secrets-hook \
            --baseline .secrets.baseline \
            --exclude-files '^(docs/|research/|helm/|supabase/config\.toml$)' \
            $(git ls-files)
