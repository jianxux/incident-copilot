name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Determine changed Python files vs origin/main
        id: changed_python
        run: |
          git fetch --no-tags --prune origin main
          CHANGED_PY_FILES="$(git diff --name-only --diff-filter=ACMRT origin/main...HEAD | grep -E '\.py$' || true)"
          {
            echo "files<<EOF"
            echo "${CHANGED_PY_FILES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check formatting with Black (changed files only)
        if: steps.changed_python.outputs.files != ''
        run: echo "${{ steps.changed_python.outputs.files }}" | xargs black --check

      - name: Check import order with isort (changed files only)
        if: steps.changed_python.outputs.files != ''
        run: echo "${{ steps.changed_python.outputs.files }}" | xargs isort --check-only --profile black
        
      - name: Lint with Ruff (changed files only on PR)
        if: github.event_name == 'pull_request' && steps.changed_python.outputs.files != ''
        run: echo "${{ steps.changed_python.outputs.files }}" | xargs ruff check

      - name: Lint with Ruff (repo-wide on main)
        if: github.event_name == 'push'
        run: ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Type check with mypy (focused)
        run: |
          # Full-src mypy is still noisy; keep this focused on actively-developed modules
          # so type regressions are caught without blocking on legacy cleanup.
          mypy src/ai src/eval src/models.py src/orchestrator.py src/web/timeline.py --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=xml --cov-fail-under=20
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          
      - name: Run Bandit security scan
        # Gate only on high-severity + high-confidence findings to avoid
        # blocking PRs on lower-confidence legacy debt.
        run: bandit -r src -lll -iii
        
      - name: Check dependencies for vulnerabilities
        run: safety check

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, typecheck]  # Test is non-blocking for now
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: incident-copilot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
