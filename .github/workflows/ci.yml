name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Find changed Python files
        id: changed-python
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- 'src/**/*.py' 'tests/**/*.py'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
      - name: No Python files changed for lint
        if: github.event_name == 'pull_request' && steps.changed-python.outputs.has_changes != 'true'
        run: echo "No changed Python files under src/ or tests/; skipping Black, isort, and Ruff."

      - name: Check formatting with Black
        if: github.event_name == 'push'
        run: black --check src tests

      - name: Check formatting with Black on changed files
        if: github.event_name == 'pull_request' && steps.changed-python.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t files <<< "${{ steps.changed-python.outputs.files }}"
          black --check "${files[@]}"
        
      - name: Check import order with isort
        if: github.event_name == 'push'
        run: isort --check-only --profile black src tests

      - name: Check import order with isort on changed files
        if: github.event_name == 'pull_request' && steps.changed-python.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t files <<< "${{ steps.changed-python.outputs.files }}"
          isort --check-only --profile black "${files[@]}"
        
      - name: Lint with Ruff
        if: github.event_name == 'push'
        run: ruff check src tests

      - name: Lint changed files with Ruff
        if: github.event_name == 'pull_request' && steps.changed-python.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t files <<< "${{ steps.changed-python.outputs.files }}"
          ruff check "${files[@]}"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Type check with mypy (focused)
        run: |
          # Full-src mypy is still noisy; keep this focused on actively-developed modules
          # so type regressions are caught without blocking on legacy cleanup.
          mypy src/ai src/eval src/models.py src/orchestrator.py src/web/timeline.py --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=xml --cov-fail-under=20
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Find changed Python files
        id: changed-python
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- 'src/**/*.py' 'tests/**/*.py'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: No Python files changed for security scan
        if: github.event_name == 'pull_request' && steps.changed-python.outputs.has_changes != 'true'
        run: echo "No changed Python files under src/ or tests/; skipping Bandit."

      - name: Run Bandit security scan
        if: github.event_name == 'push'
        run: bandit -r src -ll

      - name: Run Bandit security scan on changed files
        if: github.event_name == 'pull_request' && steps.changed-python.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t files <<< "${{ steps.changed-python.outputs.files }}"
          bandit -ll "${files[@]}"

      - name: Check dependencies for vulnerabilities
        if: github.event_name == 'push'
        run: safety check

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, typecheck]  # Test is non-blocking for now
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: incident-copilot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
