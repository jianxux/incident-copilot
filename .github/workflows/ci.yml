name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.2.0 black==24.8.0 isort==5.13.2
          
      - name: Determine changed Python files (PR baseline)
        id: changed-python
        if: github.event_name == 'pull_request'
        run: |
          # Temporary baseline gating: only lint changed Python files in PRs vs main
          # to reduce legacy noise while preserving meaningful lint guardrails.
          CHANGED_PY="$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py')"
          {
            echo "files<<EOF"
            echo "${CHANGED_PY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      
      - name: Check formatting with Black (changed files in PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "${{ steps.changed-python.outputs.files }}" ]; then
            echo "No changed Python files in this PR."
            exit 0
          fi
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" | sed '/^$/d' | xargs black --check
      
      - name: Check formatting with Black (full on push)
        if: github.event_name != 'pull_request'
        run: black --check src tests
        
      - name: Check import order with isort (changed files in PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "${{ steps.changed-python.outputs.files }}" ]; then
            echo "No changed Python files in this PR."
            exit 0
          fi
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" | sed '/^$/d' | xargs isort --check-only --profile black
      
      - name: Check import order with isort (full on push)
        if: github.event_name != 'pull_request'
        run: isort --check-only --profile black src tests
        
      - name: Lint with Ruff (changed files in PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "${{ steps.changed-python.outputs.files }}" ]; then
            echo "No changed Python files in this PR."
            exit 0
          fi
          printf '%s\n' "${{ steps.changed-python.outputs.files }}" | sed '/^$/d' | xargs ruff check
      
      - name: Lint with Ruff (full on push)
        if: github.event_name != 'pull_request'
        run: ruff check src tests

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Type check with mypy (focused)
        run: |
          # Full-src mypy is still noisy; keep this focused on actively-developed modules
          # so type regressions are caught without blocking on legacy cleanup.
          mypy src/ai src/eval src/models.py src/orchestrator.py src/web/timeline.py --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=xml --cov-fail-under=20
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          
      - name: Run Bandit security scan
        run: |
          # Temporary baseline gating: fail CI only on HIGH-severity findings to
          # reduce known medium-noise while preserving meaningful security blocking.
          # We explicitly exclude medium B608 dynamic-table-name findings for now;
          # these are noisy in current controlled query-construction paths and will
          # be re-enabled after SQL query refactor hardening.
          bandit -r src -iii -s B608
        
      - name: Check dependencies for vulnerabilities
        run: safety check

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, typecheck]  # Test is non-blocking for now
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: incident-copilot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
