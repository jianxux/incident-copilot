apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incident-copilot.fullname" . }}-secrets
  labels:
    {{- include "incident-copilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.pagerduty.apiKey }}
  PAGERDUTY_API_KEY: {{ .Values.pagerduty.apiKey | quote }}
  {{- end }}
  {{- if .Values.pagerduty.webhookSecret }}
  PAGERDUTY_WEBHOOK_SECRET: {{ .Values.pagerduty.webhookSecret | quote }}
  {{- end }}
  {{- if .Values.opsgenie.apiKey }}
  OPSGENIE_API_KEY: {{ .Values.opsgenie.apiKey | quote }}
  {{- end }}
  {{- if .Values.opsgenie.webhookSecret }}
  OPSGENIE_WEBHOOK_SECRET: {{ .Values.opsgenie.webhookSecret | quote }}
  {{- end }}
  {{- if .Values.github.token }}
  GITHUB_TOKEN: {{ .Values.github.token | quote }}
  {{- end }}
  {{- if .Values.datadog.apiKey }}
  DATADOG_API_KEY: {{ .Values.datadog.apiKey | quote }}
  {{- end }}
  {{- if .Values.datadog.appKey }}
  DATADOG_APP_KEY: {{ .Values.datadog.appKey | quote }}
  {{- end }}
  {{- if .Values.cloudwatch.accessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.cloudwatch.accessKeyId | quote }}
  {{- end }}
  {{- if .Values.cloudwatch.secretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.cloudwatch.secretAccessKey | quote }}
  {{- end }}
  {{- if .Values.slack.botToken }}
  SLACK_BOT_TOKEN: {{ .Values.slack.botToken | quote }}
  {{- end }}
  {{- if .Values.anthropic.apiKey }}
  ANTHROPIC_API_KEY: {{ .Values.anthropic.apiKey | quote }}
  {{- end }}
