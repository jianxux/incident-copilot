apiVersion: v1
kind: Service
metadata:
  name: {{ include "incident-copilot.fullname" . }}
  labels:
    {{- include "incident-copilot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "incident-copilot.selectorLabels" . | nindent 4 }}
---
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "incident-copilot.redis.fullname" . }}
  labels:
    {{- include "incident-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "incident-copilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
