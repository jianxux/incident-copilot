[project]
name = "incident-copilot"
version = "0.1.0"
description = "Context-aware incident copilot for on-call engineers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "anthropic>=0.18.0",
    "slack-sdk>=3.27.0",
    "aiohttp>=3.9.0",
    "stripe>=8.0.0",
    "email-validator>=2.0.0",
    "numpy>=1.26.0",
    "structlog>=24.1.0",
    "boto3>=1.34.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "openai>=1.12.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
incident-copilot = "src.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
preview = true
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E741"]  # Ignore line length (handled by black) and ambiguous variable names

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
no_implicit_optional = false
strict_optional = false
check_untyped_defs = false
